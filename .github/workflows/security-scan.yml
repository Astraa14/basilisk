name: Security Audit

on:
  schedule:
    - cron: "0 0 * * 0"   # weekly
  push:
    branches: [main]

jobs:
  pip-audit:
    name: Audit Python dependencies
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install pip-audit
        run: pip install pip-audit
      - name: Audit CLI dependencies
        run: |
          pip install -e .
          pip-audit
        continue-on-error: true
